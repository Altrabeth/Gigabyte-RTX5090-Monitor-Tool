[package]
name = "aorus-lcd-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Drives the LCD Edge View panel of the Gigabyte AORUS RTX 5090 Master on Linux"
repository = "https://github.com/Altrabeth/Gigabyte-RTX5090-Monitor-Tool"

[lib]
name = "aorus_lcd"
path = "src/lib.rs"

[[bin]]
name = "aorus-lcd"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rustix = { version = "1.1.6", features = ["fs"] }
log = "0.4"
nvml-wrapper = { version = "0.13", default-features = false }
# Only the formats we accept, to keep the binary small: the defaults add rayon
# and codecs such as AVIF, EXR and TIFF.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
thiserror = "2"
signal-hook = { version = "0.4.6", default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
# "s" rather than "z": image resizing and RLE encoding are CPU-bound and stay
# noticeably faster at "s" for almost the same size.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
